plugins { id 'com.android.application' }

android {
    namespace 'co.lacasadelperfume.app'
    compileSdk 34
    defaultConfig {
        applicationId 'co.lacasadelperfume.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    signingConfigs {
        release {
            storeFile file('../keystore/lacasa.jks')
            storePassword 'lacasa-perfume'
            keyAlias 'lacasa'
            keyPassword 'lacasa-perfume'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions { noCompress 'webp', 'jpg', 'png' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
