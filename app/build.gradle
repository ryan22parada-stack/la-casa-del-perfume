plugins { id 'com.android.application' }

android {
    namespace 'co.lacasadelperfume.app'
    compileSdk 34
    defaultConfig {
        applicationId 'co.lacasadelperfume.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    // Release key comes from the CI secrets KEYSTORE_B64 / KEYSTORE_PASSWORD.
    // Without them the APK is signed with the debug key (fine for testing).
    def ksFile = rootProject.file('ci-keystore.jks')
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'lacasa'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions { noCompress 'webp', 'jpg', 'png' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
