name: Construir APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Descargar librerias y fuentes (modo sin internet)
        run: |
          rm -rf app/src/main/assets/www && cp -r web app/src/main/assets/www
          python3 tools/fetch_vendor.py app/src/main/assets/www
      - name: Llave de firma (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > ci-keystore.jks; fi
      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk LaCasaDelPerfume.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LaCasaDelPerfume-apk
          path: LaCasaDelPerfume.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app LaCasaDelPerfume.apk --title "La Casa del Perfume (version ${{ github.run_number }})" --notes "APK listo para instalar en Android."
