<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:{{ w }}px;height:{{ h }}px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22))">
<div style="width:{{ capW }}px;height:{{ capH }}px;background:{{ capBg }};border-radius:{{ capR }};clip-path:{{ capClip }};box-shadow:inset 0 1px 0 rgba(255,255,255,.45)"></div>
<div style="width:{{ neckW }}px;height:{{ neckH }}px;background:{{ neckBg }}"></div>
<div style="position:relative;width:{{ bW }}px;height:{{ bH }}px;border-radius:{{ bR }};clip-path:{{ bClip }};background:{{ bBg }};box-shadow:inset 0 0 0 1px rgba(255,255,255,.38), inset 0 -10px 18px rgba(0,0,0,.22);overflow:hidden">
<div style="position:absolute;left:12%;top:8%;width:9%;height:70%;border-radius:40px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))"></div>
<div style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:{{ labW }}px;height:1px;background:rgba(255,240,205,.8)"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:140},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rect&quot;,&quot;round&quot;,&quot;cyl&quot;,&quot;facet&quot;],&quot;default&quot;:&quot;rect&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;liq&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e0ad62&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cap&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gold&quot;,&quot;black&quot;,&quot;silver&quot;],&quot;default&quot;:&quot;gold&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = +(this.props.size ?? 120), shape = this.props.shape || 'rect', liq = this.props.liq || '#e0ad62', cap = this.props.cap || 'gold';
    const dims = { rect: [.62, .6, '12%'], round: [.66, .56, '50%'], cyl: [.42, .7, (s * .07) + 'px'], facet: [.6, .6, '0'] }[shape] || [.62, .6, '12%'];
    const caps = { gold: 'linear-gradient(90deg,#7d5411,#f1d58a 35%,#c28d41 60%,#5a3b0a)', black: 'linear-gradient(90deg,#0b0a09,#4a4540 35%,#1d1b19 65%,#000)', silver: 'linear-gradient(90deg,#8a8a8c,#f4f4f5 35%,#b9b9bc 60%,#6b6b6e)' };
    const oct = 'polygon(25% 0,75% 0,100% 18%,100% 82%,75% 100%,25% 100%,0 82%,0 18%)';
    const capDims = { rect: [.3, .16, '3px'], round: [.2, .19, '45% 45% 4px 4px'], cyl: [.25, .22, '3px'], facet: [.26, .17, '2px'] }[shape] || [.3, .16, '3px'];
    return {
      w: Math.round(s * .72), h: s,
      capW: Math.round(s * capDims[0]), capH: Math.round(s * capDims[1]), capR: capDims[2], capBg: caps[cap] || caps.gold, capClip: shape === 'facet' ? oct : 'none',
      neckW: Math.round(s * .12), neckH: Math.max(2, Math.round(s * .035)), neckBg: caps[cap] || caps.gold,
      bW: Math.round(s * dims[0]), bH: Math.round(s * dims[1]), bR: dims[2], bClip: shape === 'facet' ? oct : 'none',
      bBg: `linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.28) 22%,rgba(255,255,255,0) 40%), linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,.18) 14%, ${liq} 15%, ${liq} 60%, color-mix(in oklab, ${liq} 70%, #000) 100%)`,
      labW: Math.round(s * dims[0] * .4)
    };
  }
}
</script>
</body>
</html>
